[package]
name = "shapefile-converter"
version = "0.2.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
dbase = "0.8"
flatgeobuf = { version = "6.0.1", default-features = false }
geo-types = "0.7"
geojson = "1.0.0"
geozero = { version = "0.15.1", default-features = false, features = ["with-geo"] }
serde = "1.0.229"
serde_json = "1.0.151"
shapefile = { version = "0.9.0", features = ["geo-types"] }
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
walkdir = "2.5.0"
zip = "9.0.2"

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
